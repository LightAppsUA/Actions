name: Submit for review

on:
  workflow_dispatch:
    inputs:
      repository:
        required: true
      token:
        required: true
      version:
        required: true
      build_number:
        required: true
      review_contact_phone:
        required: false
        default: ''
      result_token:
        description: The Upload Build run's token, which the result is posted under
        required: true

concurrency:
  group: deploy-${{ github.event.inputs.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  submit_for_review:
    runs-on: macos-26
    # BuildWatcher has no limit of its own, and a hung run would hold the repository's deploy queue.
    timeout-minutes: 30
    steps:
      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: repository

      - name: Parse target repository owner
        id: target-owner
        env:
          REPOSITORY: ${{ github.event.inputs.repository }}
        run: echo "owner=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target-owner.outputs.owner }}

      - name: Generate GitHub App token (LightAppsInternal)
        uses: actions/create-github-app-token@v3
        id: shared-app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: LightAppsInternal

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.repository }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Checkout LightAppsAdmin repository
        uses: actions/checkout@v7
        with:
          repository: LightAppsInternal/LightAppsAdmin
          ref: main
          token: ${{ steps.shared-app-token.outputs.token }}
          path: lightapps-admin
          fetch-depth: 1
          sparse-checkout: |
            deploy

      - name: Copy fastlane files
        run: |
          mkdir -p fastlane
          cp lightapps-admin/deploy/fastlane/Fastfile fastlane/Fastfile
          cp lightapps-admin/deploy/fastlane/Pluginfile fastlane/Pluginfile
          cp lightapps-admin/deploy/Gemfile Gemfile
          cp lightapps-admin/deploy/Gemfile.lock Gemfile.lock
          rm -rf lightapps-admin

      - name: Detect project root
        run: |
          if [ -d "ios" ] && [ -f "package.json" ]; then
            echo "WORKDIR=ios" >> $GITHUB_ENV

            rm -rf ios/fastlane ios/Gemfile ios/Gemfile.lock
            mv -f fastlane Gemfile Gemfile.lock ios/
          else
            echo "WORKDIR=." >> $GITHUB_ENV
          fi

      - name: Set up ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.9

      - name: Cache bundle dependencies
        uses: actions/cache@v6
        with:
          path: ~/work/vendor/bundle
          key: ${{ runner.os }}-ruby4.0.9-bundle-${{ hashFiles('**/Gemfile.lock', '**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-ruby4.0.9-bundle-

      - name: Install Bundle
        working-directory: ${{ env.WORKDIR }}
        run: |
          bundle config set path "$HOME/work/vendor/bundle"
          bundle install

      - name: Submit for review
        working-directory: ${{ env.WORKDIR }}
        env:
          VERSION: ${{ github.event.inputs.version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          REVIEW_CONTACT_PHONE: ${{ github.event.inputs.review_contact_phone }}
        run: bundle exec fastlane submit_for_review

      - name: Send submit-for-review result
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          SUBMIT_INFO_PATH="${TMPDIR:-/tmp}/submit_for_review_info.json"
          if [ ! -f "$SUBMIT_INFO_PATH" ]; then
            echo '{"submit_for_review_success": false, "submit_for_review_error": "The submit run failed before it reached App Store Connect"}' > "$SUBMIT_INFO_PATH"
          fi
          jq --arg token "${{ github.event.inputs.result_token }}" '. + {token: $token}' "$SUBMIT_INFO_PATH" > "$SUBMIT_INFO_PATH.tmp" && mv "$SUBMIT_INFO_PATH.tmp" "$SUBMIT_INFO_PATH"
          # The card waits on this answer: it is retried past an admin restarting for its own deploy.
          curl -fsS --retry 5 --retry-all-errors -X POST -H "Content-Type: application/json" -d "@$SUBMIT_INFO_PATH" "$BASE_URL/api/deploy/workflow-metadata"
