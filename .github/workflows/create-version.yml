name: Create version

on:
  workflow_dispatch:
    inputs:
      repository:
        required: true
      token:
        required: true
      version:

concurrency:
  group: deploy-${{ github.event.inputs.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  create_version:
    runs-on: macos-26
    steps:
      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: repository

      - name: Parse target repository owner
        id: target-owner
        env:
          REPOSITORY: ${{ github.event.inputs.repository }}
        run: echo "owner=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target-owner.outputs.owner }}

      - name: Generate GitHub App token (LightAppsInternal)
        uses: actions/create-github-app-token@v3
        id: shared-app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: LightAppsInternal

      - run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.repository }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Checkout LightAppsAdmin repository
        uses: actions/checkout@v7
        with:
          repository: LightAppsInternal/LightAppsAdmin
          ref: main
          token: ${{ steps.shared-app-token.outputs.token }}
          path: lightapps-admin
          fetch-depth: 1
          sparse-checkout: |
            deploy
            lib/deploy

      - name: Set up asc
        run: |
          mv lightapps-admin "$RUNNER_TEMP/lightapps-admin"
          bash "$RUNNER_TEMP/lightapps-admin/deploy/asc/setup.sh"

      - name: Detect project root
        run: |
          if [ -d "ios" ] && [ -f "package.json" ]; then
            echo "WORKDIR=ios" >> $GITHUB_ENV
          else
            echo "WORKDIR=." >> $GITHUB_ENV
          fi

      - name: Create version
        working-directory: ${{ env.WORKDIR }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          lane create_version

          VERSION_INFO_PATH="${TMPDIR:-/tmp}/version_info.json"
          if [ -f "$VERSION_INFO_PATH" ]; then
            jq --arg token "${{ github.event.inputs.token }}" '. + {token: $token}' "$VERSION_INFO_PATH" > "$VERSION_INFO_PATH.tmp" && mv "$VERSION_INFO_PATH.tmp" "$VERSION_INFO_PATH"

            curl -X POST -H "Content-Type: application/json" -d "@$VERSION_INFO_PATH" "$BASE_URL/api/deploy/workflow-metadata"
          fi
